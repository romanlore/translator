name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: |
          npm install expo@latest --legacy-peer-deps
          npx expo install @expo/vector-icons
          npx expo install --fix
      - run: npx expo prebuild --platform android --clean --non-interactive
      - working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ru-hi-translator-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
