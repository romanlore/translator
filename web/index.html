<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="RU⇄HI" />
  <meta name="theme-color" content="#4F46E5" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>RU ⇄ HI Переводчик</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      overscroll-behavior: none;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.55); }
      70% { box-shadow: 0 0 0 14px rgba(220, 38, 38, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }
    .rec-active { animation: pulse-ring 1.3s infinite; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 h-[100dvh] flex flex-col overflow-hidden">
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shrink-0">
    <div>
      <h1 class="text-base font-bold text-slate-900">RU ⇄ HI Переводчик</h1>
      <p class="text-[11px] text-slate-500">Голосовой перевод через Gemini</p>
    </div>
    <div class="flex items-center gap-2">
      <button id="settingsBtn" type="button" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-50 text-rose-700">
        Нужен ключ
      </button>
      <button id="clearBtn" type="button" class="px-2 py-1.5 rounded-lg text-xs text-slate-400 hover:text-slate-700">
        Очистить
      </button>
    </div>
  </header>

  <main id="feed" class="flex-1 overflow-y-auto px-4 py-4 space-y-3">
    <div id="emptyState" class="h-full flex flex-col items-center justify-center text-center px-4">
      <div class="w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mb-3 text-xl font-bold">
        RU⇄HI
      </div>
      <h2 class="text-base font-semibold text-slate-800 mb-1">Готов к диалогу</h2>
      <p class="text-xs text-slate-500 max-w-xs">
        Нажмите кнопку внизу, скажите фразу и нажмите ещё раз — аудио уйдёт в Gemini, который распознает речь (включая хинди и хинглиш) и озвучит перевод.
      </p>
    </div>
    <div id="msgList" class="space-y-3"></div>
  </main>

  <div id="recBanner" class="hidden bg-rose-50 border-t border-rose-200 px-4 py-2 text-xs font-semibold text-rose-700 flex items-center gap-2 shrink-0">
    <span class="w-2.5 h-2.5 rounded-full bg-rose-600 animate-ping"></span>
    <span id="recText">Идёт запись... Нажмите кнопку ещё раз для перевода</span>
  </div>

  <footer class="bg-white border-t border-slate-200 p-3 space-y-2.5 shrink-0">
    <div class="grid grid-cols-2 gap-2.5">
      <button id="btnRu" type="button" class="py-3.5 px-3 rounded-2xl bg-indigo-600 active:bg-indigo-700 text-white text-center shadow-sm transition">
        <div id="btnRuTitle" class="text-sm font-bold">Я говорю</div>
        <div class="text-[11px] opacity-85 font-medium">RU → HI</div>
      </button>
      <button id="btnHi" type="button" class="py-3.5 px-3 rounded-2xl bg-orange-500 active:bg-orange-600 text-white text-center shadow-sm transition">
        <div id="btnHiTitle" class="text-sm font-bold">Собеседник</div>
        <div class="text-[11px] opacity-85 font-medium">HI → RU</div>
      </button>
    </div>
    <form id="manualForm" class="flex items-center gap-2">
      <button id="dirToggle" type="button" class="px-2.5 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold shrink-0">RU→HI</button>
      <input id="manualInput" type="text" placeholder="Или введите текст..." class="flex-1 min-w-0 px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <button type="submit" class="px-3.5 py-2 rounded-xl bg-slate-900 text-white text-sm font-bold shrink-0">→</button>
    </form>
  </footer>

  <!-- Settings Modal -->
  <div id="modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-3.5 shadow-xl">
      <h3 class="text-base font-bold text-slate-900">Настройки Gemini API</h3>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">API ключ (Google AI Studio)</label>
        <input id="apiKeyInput" type="password" placeholder="AIza..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Модель</label>
        <select id="modelSelect" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-white">
          <option value="gemini-3.8-flash">gemini-3.8-flash (рекомендуемая)</option>
          <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (сверхбыстрая)</option>
          <option value="gemini-2.5-flash">gemini-2.5-flash</option>
        </select>
      </div>
      <label class="flex items-center justify-between text-xs text-slate-700">
        <span>Озвучивать перевод автоматически</span>
        <input id="autoSpeakCheck" type="checkbox" checked class="w-4 h-4 accent-indigo-600" />
      </label>
      <label class="flex items-center justify-between text-xs text-slate-700">
        <span>Показывать транслитерацию хинди</span>
        <input id="translitCheck" type="checkbox" checked class="w-4 h-4 accent-indigo-600" />
      </label>
      <div class="flex justify-end gap-2 pt-2">
        <button id="closeModalBtn" type="button" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-semibold">Закрыть</button>
        <button id="saveModalBtn" type="button" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      apiKey: localStorage.getItem('pwa_ru_hi_key') || '',
      model: localStorage.getItem('pwa_ru_hi_model') || 'gemini-3.8-flash',
      autoSpeak: (localStorage.getItem('pwa_ru_hi_speak') ?? 'true') === 'true',
      translit: (localStorage.getItem('pwa_ru_hi_translit') ?? 'true') === 'true',
      manualDir: 'ru-hi',
      messages: [],
      recorder: null,
      chunks: [],
      activeDir: null
    };

    const $ = (id) => document.getElementById(id);

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function updateKeyUI() {
      if (state.apiKey) {
        $('settingsBtn').textContent = 'Настройки';
        $('settingsBtn').className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-50 text-emerald-700';
      } else {
        $('settingsBtn').textContent = 'Нужен ключ';
        $('settingsBtn').className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-50 text-rose-700';
      }
    }

    function speak(text, dir) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = dir === 'ru-hi' ? 'hi-IN' : 'ru-RU';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }

    function render() {
      $('emptyState').classList.toggle('hidden', state.messages.length > 0);
      $('msgList').innerHTML = state.messages.map((m) => {
        const isRu = m.dir === 'ru-hi';
        return `
          <div class="flex ${isRu ? 'justify-end' : 'justify-start'}">
            <div class="max-w-[88%] rounded-2xl px-4 py-3 shadow-sm ${isRu ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-900'}">
              <div class="flex justify-between gap-3 text-[10px] font-bold uppercase opacity-75 mb-1">
                <span>${isRu ? 'Вы (RU → HI)' : 'Собеседник (HI → RU)'}</span>
                <span>${esc(m.time)}</span>
              </div>
              <div class="text-xs opacity-85 pb-2 mb-2 border-b ${isRu ? 'border-white/20' : 'border-slate-100'}">${esc(m.source)}</div>
              ${m.loading ? '<div class="text-xs animate-pulse">Перевожу через Gemini...</div>' :
                m.error ? `<div class="text-xs text-rose-200 bg-rose-950/30 p-2 rounded-lg">${esc(m.error)}</div>` : `
                <div class="text-base font-semibold leading-snug">${esc(m.translated)}</div>
                ${m.translit ? `<div class="text-xs italic opacity-80 mt-1">${esc(m.translit)}</div>` : ''}
                <div class="flex gap-2 mt-2.5">
                  <button data-speak="${m.id}" class="px-2.5 py-1 rounded-lg text-xs font-semibold ${isRu ? 'bg-white/20' : 'bg-slate-100 text-slate-700'}">Озвучить</button>
                  <button data-copy="${m.id}" class="px-2.5 py-1 rounded-lg text-xs font-semibold ${isRu ? 'bg-white/20' : 'bg-slate-100 text-slate-700'}">Копия</button>
                </div>
              `}
            </div>
          </div>
        `;
      }).join('');
      $('feed').scrollTop = $('feed').scrollHeight;
    }

    async function callGemini(parts) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(state.model)}:generateContent`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': state.apiKey },
        body: JSON.stringify({
          contents: [{ parts }],
          generationConfig: { temperature: 0.2, responseMimeType: 'application/json' }
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data?.error?.message || `Ошибка API (${res.status})`);
      const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
      try { return JSON.parse(raw); } catch {
        const m = raw.match(/\{[\s\S]*\}/);
        return m ? JSON.parse(m[0]) : { translation: raw };
      }
    }

    async function sendAudio(blob, mimeType, dir) {
      const id = String(Date.now());
      const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      const msg = { id, dir, source: 'Распознаю голос...', translated: '', translit: '', loading: true, error: '', time };
      state.messages.push(msg);
      render();

      try {
        const base64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result.split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });

        const isRu = dir === 'ru-hi';
        const prompt = isRu
          ? `Распознай русскую речь и переведи на естественный разговорный хинди (деванагари).${state.translit ? ' Добавь транслитерацию латиницей.' : ''} Верни строго JSON: {"transcript":"...","translation":"...","translit":"..."}`
          : `Распознай речь на хинди или хинглише и переведи на естественный русский язык. Верни строго JSON: {"transcript":"...","translation":"...","translit":""}`;

        const cleanMime = (mimeType || 'audio/mp4').split(';')[0];
        const parsed = await callGemini([
          { text: prompt },
          { inlineData: { mimeType: cleanMime, data: base64 } }
        ]);

        msg.loading = false;
        msg.source = parsed.transcript || '(Голосовое сообщение)';
        msg.translated = parsed.translation || '';
        msg.translit = isRu && state.translit ? (parsed.translit || '') : '';
        render();
        if (state.autoSpeak && msg.translated) speak(msg.translated, dir);
      } catch (e) {
        msg.loading = false;
        msg.error = e.message || 'Ошибка перевода';
        render();
      }
    }

    async function toggleRecord(dir) {
      if (!state.apiKey) { $('modal').classList.remove('hidden'); return; }

      if (state.recorder && state.recorder.state === 'recording') {
        state.recorder.stop();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const preferredMime = MediaRecorder.isTypeSupported('audio/mp4')
          ? 'audio/mp4'
          : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '');
        const rec = preferredMime ? new MediaRecorder(stream, { mimeType: preferredMime }) : new MediaRecorder(stream);

        state.chunks = [];
        state.activeDir = dir;
        state.recorder = rec;

        rec.ondataavailable = (e) => { if (e.data.size > 0) state.chunks.push(e.data); };
        rec.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          const mime = rec.mimeType || preferredMime || 'audio/mp4';
          const blob = new Blob(state.chunks, { type: mime });
          const finishedDir = state.activeDir;
          state.activeDir = null;
          state.recorder = null;
          updateRecUI();
          sendAudio(blob, mime, finishedDir);
        };

        rec.start();
        updateRecUI();
      } catch (e) {
        alert('Нет доступа к микрофону. Разрешите доступ в настройках браузера.');
      }
    }

    function updateRecUI() {
      const rec = Boolean(state.activeDir);
      $('recBanner').classList.toggle('hidden', !rec);
      $('btnRu').classList.toggle('rec-active', state.activeDir === 'ru-hi');
      $('btnHi').classList.toggle('rec-active', state.activeDir === 'hi-ru');
      $('btnRuTitle').textContent = state.activeDir === 'ru-hi' ? 'Стоп и перевести' : 'Я говорю';
      $('btnHiTitle').textContent = state.activeDir === 'hi-ru' ? 'Стоп и перевести' : 'Собеседник';
    }

    $('btnRu').onclick = () => toggleRecord('ru-hi');
    $('btnHi').onclick = () => toggleRecord('hi-ru');
    $('clearBtn').onclick = () => { state.messages = []; render(); };
    $('settingsBtn').onclick = () => {
      $('apiKeyInput').value = state.apiKey;
      $('modelSelect').value = state.model;
      $('autoSpeakCheck').checked = state.autoSpeak;
      $('translitCheck').checked = state.translit;
      $('modal').classList.remove('hidden');
    };
    $('closeModalBtn').onclick = () => $('modal').classList.add('hidden');
    $('saveModalBtn').onclick = () => {
      state.apiKey = $('apiKeyInput').value.trim();
      state.model = $('modelSelect').value;
      state.autoSpeak = $('autoSpeakCheck').checked;
      state.translit = $('translitCheck').checked;
      localStorage.setItem('pwa_ru_hi_key', state.apiKey);
      localStorage.setItem('pwa_ru_hi_model', state.model);
      localStorage.setItem('pwa_ru_hi_speak', String(state.autoSpeak));
      localStorage.setItem('pwa_ru_hi_translit', String(state.translit));
      updateKeyUI();
      $('modal').classList.add('hidden');
    };
    $('dirToggle').onclick = () => {
      state.manualDir = state.manualDir === 'ru-hi' ? 'hi-ru' : 'ru-hi';
      $('dirToggle').textContent = state.manualDir === 'ru-hi' ? 'RU→HI' : 'HI→RU';
    };
    $('manualForm').onsubmit = async (e) => {
      e.preventDefault();
      const text = $('manualInput').value.trim();
      if (!text) return;
      if (!state.apiKey) { $('modal').classList.remove('hidden'); return; }
      $('manualInput').value = '';

      const dir = state.manualDir;
      const id = String(Date.now());
      const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      const msg = { id, dir, source: text, translated: '', translit: '', loading: true, error: '', time };
      state.messages.push(msg);
      render();

      try {
        const isRu = dir === 'ru-hi';
        const prompt = isRu
          ? `Переведи с русского на естественный разговорный хинди (деванагари).${state.translit ? ' Добавь транслитерацию латиницей.' : ''} Верни строго JSON: {"translation":"...","translit":"..."}. Фраза: ${text}`
          : `Переведи с хинди на естественный разговорный русский. Верни строго JSON: {"translation":"...","translit":""}. Фраза: ${text}`;
        const parsed = await callGemini([{ text: prompt }]);
        msg.loading = false;
        msg.translated = parsed.translation || '';
        msg.translit = isRu && state.translit ? (parsed.translit || '') : '';
        render();
        if (state.autoSpeak && msg.translated) speak(msg.translated, dir);
      } catch (err) {
        msg.loading = false;
        msg.error = err.message || 'Ошибка перевода';
        render();
      }
    };

    $('msgList').onclick = (e) => {
      const speakId = e.target.getAttribute('data-speak');
      const copyId = e.target.getAttribute('data-copy');
      if (speakId) {
        const m = state.messages.find((x) => x.id === speakId);
        if (m) speak(m.translated, m.dir);
      }
      if (copyId) {
        const m = state.messages.find((x) => x.id === copyId);
        if (m && navigator.clipboard) navigator.clipboard.writeText(m.translated);
      }
    };

    updateKeyUI();
    if (!state.apiKey) $('modal').classList.remove('hidden');
  </script>
</body>
</html>
